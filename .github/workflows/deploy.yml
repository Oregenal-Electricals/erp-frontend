name: Frontend CI/CD
on:
  push:
    branches:
      - staging
      - main
      - dev
  pull_request:
    branches:
      - develop
      - staging
jobs:
  test:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_NAME: 'ERP Manufacturing'
          NEXT_PUBLIC_APP_VERSION: '1.0.0'
